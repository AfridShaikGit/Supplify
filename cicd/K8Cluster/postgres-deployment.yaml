apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres

          image: afridshaik3838/postgres:15

          env:
            - name: POSTGRES_DB
              value: supplify

            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: "3838@Bismillah"

          ports:
            - containerPort: 5432